<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Hero wallpaper for JAMBwise. Replace this file (or set the hero-img variable in src/index.css to your own photo) to change it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f6b4a" stop-opacity=".16"/>
      <stop offset=".55" stop-color="#18a574" stop-opacity=".06"/>
      <stop offset="1" stop-color="#e7b416" stop-opacity=".16"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#18a574" stop-opacity=".30"/>
      <stop offset="1" stop-color="#18a574" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#0f6b4a" fill-opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="1280" cy="260" r="360" fill="url(#glow)"/>
  <circle cx="1450" cy="760" r="300" fill="#e7b416" fill-opacity=".10"/>
  <g fill="none" stroke="#0f6b4a" stroke-opacity=".30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- atom -->
    <g transform="translate(1180 210)">
      <ellipse rx="130" ry="46"/><ellipse rx="130" ry="46" transform="rotate(60)"/><ellipse rx="130" ry="46" transform="rotate(120)"/>
      <circle r="12" fill="#0f6b4a" fill-opacity=".35"/>
    </g>
    <!-- flask -->
    <g transform="translate(1390 520)"><path d="M-22 -90h44M-14 -90v60L-70 60a14 14 0 0 0 12 22h116a14 14 0 0 0 12-22L14 -30v-60"/><path d="M-50 30h100"/></g>
    <!-- graph -->
    <g transform="translate(980 560)"><path d="M0 -120V0H220"/><path d="M0 -10C50 -20 70 -110 120 -100S190 -40 220 -90" stroke="#e7b416" stroke-opacity=".6"/></g>
    <!-- triangle + angle -->
    <g transform="translate(1110 780)"><path d="M0 0H170L0 -110Z"/><path d="M40 0a40 40 0 0 0-14-30"/></g>
    <!-- leaf -->
    <g transform="translate(1480 120)"><path d="M0 70C-40 20 -20 -40 50 -60C60 10 40 60 0 70Z"/><path d="M0 70L28 -20"/></g>
  </g>
  <g fill="#0f6b4a" fill-opacity=".22" font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="860" y="150" font-size="70">E = mc²</text>
    <text x="1330" y="400" font-size="64">∑ x²</text>
    <text x="900" y="420" font-size="56">√(a² + b²)</text>
    <text x="1500" y="640" font-size="58">π</text>
    <text x="1020" y="880" font-size="52">H₂O</text>
    <text x="1250" y="700" font-size="46">F = ma</text>
  </g>
</svg>
